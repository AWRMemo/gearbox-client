[package]
name = "relay-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[features]
test-utils = []
sentry-integration = ["sentry"]

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
ring = "0.17"
thiserror = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
argon2 = "0.5"
aes-gcm = "0.10"
# Vector search (sync wrappers via pollster)
lancedb = "0.29"
arrow = "58"
arrow-array = "58"
arrow-schema = "58"
pollster = "0.4"
futures = "0.3"
# Connection pooling
r2d2 = "0.8"
# Lightweight HTTP client (replaces reqwest)
ureq = { version = "2.12", features = ["json"] }
# Optional Sentry integration (telemetry)
sentry = { version = "0.36", optional = true }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "time"] }
