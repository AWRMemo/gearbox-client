[package]
name = "relay-mobile-bridge"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[lints.rust]
unexpected_cfgs = "allow"

[dependencies]
relay-core = { path = "../../relay-core", features = ["test-utils"] }
flutter_rust_bridge = "=2.12.0"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
argon2 = "0.5"
aes-gcm = "0.10"
base64 = "0.22"
ring = "0.17"
rusqlite = { version = "0.31", features = ["bundled"] }
