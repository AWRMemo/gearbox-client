name: Flutter Analyze

on:
  pull_request:
    branches: [main]
    paths:
      - 'relay_mobile/**'
  push:
    branches: [main]
    paths:
      - 'relay_mobile/**'

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.48.0'
          channel: 'stable'

      - name: Cache Flutter
        uses: actions/cache@v4
        env:
          PUB_CACHE: ${{ github.workspace }}/.pub-cache
        with:
          path: |
            ${{ env.PUB_CACHE }}
          key: ${{ runner.os }}-flutter-${{ hashFiles('relay_mobile/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-flutter-

      - name: Get dependencies
        run: flutter pub get
        working-directory: relay_mobile

      - name: Analyze Dart code
        run: flutter analyze --fatal-infos
        working-directory: relay_mobile
