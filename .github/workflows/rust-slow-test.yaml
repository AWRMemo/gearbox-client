name: Rust Slow Tests

on:
  schedule:
    - cron: '0 4 * * *'  # nightly at 04:00 UTC
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  slow-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libclang-dev libssl-dev libsqlite3-dev \
            libgomp1 libopenblas-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace

      - name: Cache model assets
        uses: actions/cache@v4
        with:
          path: ~/.local/share/relay/models
          key: relay-models-${{ runner.os }}-${{ hashFiles('scripts/download-qwen-gguf.sh') }}
          restore-keys: relay-models-${{ runner.os }}-

      - name: Download Qwen model (if cache miss)
        run: |
          if [ ! -f ~/.local/share/relay/models/qwen3.5-0.8b-q4_k_m.gguf ]; then
            bash scripts/download-qwen-gguf.sh
          fi

      - name: Run ignored (slow) tests
        run: cargo test -p relay -p relay-core -- --ignored --test-threads=1
        timeout-minutes: 120
