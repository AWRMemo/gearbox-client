<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Relay Capture — Options</title>
<style>
  body { font-family: system-ui, sans-serif; font-size: 13px; max-width: 400px; margin: 20px auto; padding: 0 16px; color: #E8E6E3; background: #0A0A0F; }
  label { display: block; font-weight: 600; margin-bottom: 4px; color: #FFB000; }
  input { width: 100%; padding: 8px; border: 1px solid #333; border-radius: 4px; background: #1a1a2e; color: #E8E6E3; font-family: monospace; font-size: 12px; box-sizing: border-box; }
  button { margin-top: 12px; padding: 8px 16px; background: #FFB000; color: #0A0A0F; border: none; border-radius: 4px; font-weight: 600; cursor: pointer; }
  .note { font-size: 11px; color: #666; margin-top: 8px; }
  .saved { color: #4caf50; margin-left: 8px; font-size: 12px; }
</style></head>
<body>
<h1 style="color: #FFB000; font-size: 16px;">Relay Capture</h1>
<p style="color: #888; font-size: 12px;">Configure the connection to your Gearbox Relay desktop app.</p>
<label for="endpoint">Capture Endpoint</label>
<input type="text" id="endpoint" placeholder="http://127.0.0.1:3000/v1/extension/capture">
<p class="note">Default: Gearbox Relay extension capture endpoint on your local machine.</p>
<button id="save">Save</button>
<span id="status" class="saved"></span>
<p class="note" style="margin-top: 16px;">
  <a href="https://github.com/AWRMemo/gearbox-client" style="color: #FFB000;">Open source (Apache 2.0)</a> ·
  <a href="https://github.com/AWRMemo/gearbox-client/blob/main/PRIVACY.md" style="color: #FFB000;">Privacy</a>
</p>
<script src="options.js"></script>
</body></html>
