<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Relay Capture</title><style>
  body { width:280px; margin:0; font-family:system-ui,sans-serif; font-size:13px; background:#0A0A0F; color:#E8E6E3; }
  .header { background:#FFB000; color:#0A0A0F; padding:10px 14px; font-weight:600; font-size:14px; }
  .captures { padding:8px 14px; }
  .captures.empty { color:#666; text-align:center; padding:20px; }
  .item { background:#1a1a2e; border-radius:4px; padding:8px 10px; margin-bottom:6px; box-shadow:0 1px 2px rgba(0,0,0,0.3); border-left: 2px solid #FFB000; }
  .item .summary { font-size:12px; color:#E8E6E3; margin-bottom:2px; }
  .item .source { font-size:10px; color:#666; word-break:break-all; }
  .item .tags { margin-top:3px; }
  .item .tags span { display:inline-block; background:#2a2a3e; color:#FFB000; font-size:9px; padding:1px 5px; border-radius:3px; margin-right:3px; }
</style></head>
<body>
<div class="header">Relay Capture</div>
<div id="captures" class="captures empty">No captures yet. Right-click selected text → "Capture to Relay"</div>
<script src="popup.js"></script>
</body></html>
